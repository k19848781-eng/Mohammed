<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mohammed TV</title>
<link rel="manifest" href="tv-manifest.json">
<meta name="theme-color" content="#0E1A2B">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Noto+Sans+Arabic:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.4.12/hls.min.js"></script>
<style>
:root{
  --bg:#EEF2F7; --panel:#FFFFFF; --ink:#0E1A2B; --muted:#5B6B80; --line:#D6DEE8;
  --signal:#E09A12; --signal-ink:#1B1200; --sky:#2F6FB0; --screen:#0A1422; --danger:#B3261E;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1A2B; --panel:#15253A; --ink:#EAF1F8; --muted:#93A6BD; --line:#24384F;
    --signal:#F2B33D; --signal-ink:#1B1200; --sky:#7FB3E6; --screen:#050C16; --danger:#F2867D;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1A2B; --panel:#15253A; --ink:#EAF1F8; --muted:#93A6BD; --line:#24384F;
  --signal:#F2B33D; --signal-ink:#1B1200; --sky:#7FB3E6; --screen:#050C16; --danger:#F2867D;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Bricolage Grotesque","Noto Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--signal);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding:16px}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.brand{font-weight:800;font-size:1.6rem;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
.brand{font-size:16px!important;line-height:1.4;width:100%;white-space:nowrap;justify-content:center}
#brandText{display:inline-block}
.brand .tel{color:inherit;text-decoration:none;unicode-bidi:isolate}
.phone{color:var(--ink);text-decoration:none;font-weight:600;font-size:1.05rem;white-space:nowrap;padding:8px 14px;border:1px solid var(--line);border-radius:999px;background:var(--panel);font-variant-numeric:tabular-nums}
.brand .dot{width:12px;height:12px;border-radius:50%;background:var(--signal);box-shadow:0 0 0 4px color-mix(in srgb,var(--signal) 25%,transparent)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:9px 16px;font-weight:600}
.btn.primary{background:var(--signal);border-color:var(--signal);color:var(--signal-ink)}
.btn.ghost{background:transparent}
.layout{display:grid;gap:16px}
@media (min-width:860px){.layout{grid-template-columns:1.5fr 1fr;align-items:start}}

/* Screen + remote */
.tv{background:var(--screen);border-radius:18px;overflow:hidden;position:relative}
.tv video{display:block;width:100%;aspect-ratio:16/9;background:#000}
.osd{position:absolute;top:12px;right:14px;font-weight:800;font-size:2.4rem;line-height:1;color:#7CF2A0;
  text-shadow:0 0 12px rgba(124,242,160,.6);font-variant-numeric:tabular-nums;opacity:0;transition:opacity .3s;pointer-events:none}
.osd.show{opacity:1}
.empty-screen{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#C7D5E6;padding:20px}
.empty-screen p{margin:.3rem 0;max-width:34ch}
.remote{display:flex;align-items:center;gap:12px;margin-top:12px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px}
.chnum{font-weight:800;font-size:2rem;min-width:2.5ch;text-align:center;font-variant-numeric:tabular-nums;color:var(--signal)}
.nowinfo{flex:1;min-width:0}
.nowinfo .name{font-weight:600;font-size:1.1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nowinfo .meta{color:var(--muted);font-size:.9rem}
.updown{display:flex;flex-direction:column;gap:6px}
.updown button{width:44px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-weight:800}
.status{margin-top:8px;font-size:.9rem;color:var(--muted);min-height:1.3em}
.status.err{color:var(--danger)}

/* Channel list */
.guide{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px}
.guide h2{margin:0 0 10px;font-size:1.15rem}
.search{width:100%;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 4px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;white-space:nowrap;font-size:.9rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.list{list-style:none;margin:8px 0 0;padding:0;max-height:60vh;overflow-y:auto}
.item{display:flex;align-items:center;gap:12px;padding:10px 6px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .num{font-weight:800;width:2.4ch;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.item.on .num{color:var(--signal)}
.item .play{flex:1;min-width:0;text-align:start;background:none;border:0;padding:4px 0}
.item .play strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .play span{font-size:.85rem;color:var(--muted)}
.item .icon{background:none;border:0;color:var(--muted);padding:6px 8px;border-radius:8px}
.empty-list{color:var(--muted);padding:16px 4px}

/* Dialog */
dialog{border:1px solid var(--line);border-radius:18px;background:var(--panel);color:var(--ink);padding:0;width:min(520px,94vw)}
dialog::backdrop{background:rgba(5,12,22,.55)}
.dlg{padding:18px;display:grid;gap:12px}
.dlg h3{margin:0;font-size:1.2rem}
.dlg label{display:grid;gap:4px;font-weight:600;font-size:.95rem}
.dlg input,.dlg select,.dlg textarea{padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-weight:400}
.dlg textarea{min-height:120px;font-family:ui-monospace,Menlo,monospace;font-size:.85rem}
.dlg .hint{color:var(--muted);font-size:.85rem;font-weight:400}
.dlg .row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.tabs{display:flex;gap:6px}
.fsbtn{margin-top:10px;width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-weight:600;font-size:1rem}
.exitbtn{display:none}
.osd small{display:block;font-size:1rem;font-weight:600;margin-top:4px;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.8)}
body.ott{overflow:hidden;background:#000}
body.ott .tv{position:fixed;inset:0;border-radius:0;z-index:50;background:#000}
body.ott .tv video{width:100%;height:100%;aspect-ratio:auto;object-fit:contain}
body.ott .empty-screen{display:none!important}
body.ott .osd{font-size:4rem;top:24px;right:32px}
body.ott .osd small{font-size:1.5rem}
body.ott header{position:fixed;top:0;left:0;right:0;z-index:65;margin:0;padding:18px 28px 40px;color:#fff;background:linear-gradient(rgba(0,0,0,.8),transparent);opacity:0;transition:opacity .3s;pointer-events:none}
body.ott.info header,body.ott.guide-open header{opacity:1}
body.ott .brand{justify-content:flex-start;color:#fff}
body.ott .brand .tel{color:#fff}
body.ott .remote,body.ott .fsbtn{display:none}
body.ott .status{position:fixed;bottom:16px;right:24px;z-index:56;margin:0;color:#fff;background:rgba(0,0,0,.65);padding:6px 12px;border-radius:8px}
body.ott .status:empty{display:none}
body.ott .guide{position:fixed;top:0;bottom:0;left:0;width:min(440px,45vw);z-index:60;border:0;border-radius:0;background:rgba(10,20,34,.94);color:#EAF1F8;padding:24px 16px 16px;display:flex;flex-direction:column;transform:translateX(-105%);transition:transform .25s}
body.ott.guide-open .guide{transform:none}
body.ott .guide h2{color:#F2B33D}
body.ott .guide .list{max-height:none;flex:1}
body.ott .guide .search{background:rgba(255,255,255,.1);border-color:transparent;color:#fff}
body.ott .item{border-color:rgba(255,255,255,.12)}
body.ott .item .num{color:#93A6BD}
body.ott .item.on{background:rgba(242,179,61,.16);border-radius:10px}
body.ott .item .play:focus{outline:3px solid #F2B33D;outline-offset:4px;border-radius:6px}
body.ott.manual .exitbtn{display:block;margin-bottom:12px;padding:10px;border-radius:10px;border:0;background:rgba(255,255,255,.12);color:#fff;font-weight:600}
header{display:none!important}
video::-internal-media-controls-overlay-cast-button{display:none !important}
video::-webkit-media-controls-overlay-cast-button{display:none !important}
#act{position:fixed;inset:0;z-index:99;background:#0E1A2B;color:#EAF1F8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:20px;text-align:center}
#act[hidden]{display:none}
#act h2{margin:0;font-size:clamp(1.2rem,3.5vw,2rem)}
#act .dots{display:flex;gap:14px}
#act .dots span{width:clamp(38px,7vw,60px);height:clamp(48px,9vw,72px);border:2px solid #3a4d66;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:clamp(1.4rem,4vw,2.4rem);font-weight:800}
#act .dots span.on{border-color:#F5B83D}
#act .msg{min-height:1.4em;color:#ff8a8a;font-weight:600}
#act .pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:min(300px,80vw)}
#act .pad button{font:inherit;font-size:clamp(1.1rem,3vw,1.6rem);font-weight:700;padding:clamp(8px,1.8vh,16px) 0;border-radius:12px;border:2px solid transparent;background:#1c2c42;color:#EAF1F8;cursor:pointer}
#act .pad button:focus{outline:none;border-color:#F5B83D;background:#2a3f5c}
#act .pad .ok{background:#F5B83D;color:#0E1A2B}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="act" hidden><h2>Enter activation code</h2><div class="dots"><span></span><span></span><span></span><span></span></div><div class="msg" id="actMsg"></div><div class="pad"><button>1</button><button>2</button><button>3</button><button>4</button><button>5</button><button>6</button><button>7</button><button>8</button><button>9</button><button data-k="del">⌫</button><button>0</button><button data-k="ok" class="ok">OK</button></div></div>
<div class="wrap">
  <header>
    <div class="brand"><span id="brandText">Mohammed TV - <a class="tel" href="tel:07503434302">07503434302</a></span></div>
  </header>

  <div class="layout">
    <section aria-label="Player">
      <div class="tv">
        <video id="video" controls playsinline controlslist="nodownload noplaybackrate noremoteplayback" disablepictureinpicture disableremoteplayback x-webkit-airplay="deny"></video>
        <div class="osd" id="osd" aria-hidden="true"></div>
        <div class="empty-screen" id="emptyScreen">
          <div>
            <p><strong>No channel playing</strong></p>
            <p>Tap a channel to start watching.</p>
          </div>
        </div>
      </div>
      <div class="remote">
        <div class="chnum" id="chnum">–</div>
        <div class="nowinfo">
          <div class="name" id="nowName">Pick a channel</div>
          <div class="meta" id="nowMeta">Use ▲ ▼ or your arrow keys to switch</div>
        </div>
        <div class="updown">
          <button id="upBtn" aria-label="Previous channel">▲</button>
          <button id="downBtn" aria-label="Next channel">▼</button>
        </div>
      </div>
      <button class="fsbtn" id="fsBtn">⛶ Full screen</button>
      <div class="status" id="status" role="status"></div>
    </section>

    <section class="guide" aria-label="Channel list">
      <button class="exitbtn" id="exitOtt">✕ Exit full screen</button>
      <h2>Channels</h2>
      <input class="search" id="search" type="search" placeholder="Search channels">
      <ul class="list" id="list"></ul>
    </section>
  </div>
</div>


<script>
(function(){
  const PLAYLIST = 'https://raw.githubusercontent.com/k19848781-eng/Mohammed/main/playlist.m3u';
  const CACHE = 'mohammed-tv-cache';
  const $ = id => document.getElementById(id);
  const video = $('video');
  let channels = [], current = -1, filter = 'All', query = '', hls = null, osdTimer;

  function setStatus(msg, err){ const s=$('status'); s.textContent=msg||''; s.classList.toggle('err',!!err); }
  function esc(s){ return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
  function isYouTube(u){ return /youtube\.com|youtu\.be/i.test(u); }

  function parseM3u(text){
    const out = []; let pending = null;
    text.split(/\r?\n/).forEach(line => {
      line = line.trim();
      if (line.startsWith('#EXTINF')){
        const g = line.match(/group-title="([^"]*)"/i);
        pending = {name: line.split(',').slice(1).join(',').trim() || 'Channel', cat: g && g[1] ? g[1] : 'Other'};
      } else if (line && !line.startsWith('#') && pending){
        out.push({name: pending.name, url: line, cat: pending.cat}); pending = null;
      }
    });
    return out;
  }

  async function loadPlaylist(){
    $('list').innerHTML = '<li class="empty-list">Loading channels…</li>';
    try {
      const res = await fetch(PLAYLIST + '?t=' + Date.now(), {cache:'no-store'});
      if (!res.ok) throw new Error();
      const text = await res.text();
      channels = parseM3u(text);
      try { localStorage.setItem(CACHE, text); } catch(e){}
    } catch(e){
      let cached = null; try { cached = localStorage.getItem(CACHE); } catch(_){}
      if (cached){ channels = parseM3u(cached); setStatus('Offline: showing your last saved channel list.'); }
      else {
        $('list').innerHTML = '<li class="empty-list">Couldn’t load channels. Check your internet connection. <button class="btn" id="retry" style="margin-top:10px">Try again</button></li>';
        $('retry').onclick = loadPlaylist; return;
      }
    }
    render();
    if (channels.length && current < 0) tune(0);
  }

  function categories(){ return ['All', ...[...new Set(channels.map(c => c.cat))].sort()]; }

  function render(){
    const list = $('list'); list.innerHTML = '';
    const shown = channels.map((c,i)=>({c,i})).filter(({c}) =>
      c.name.toLowerCase().includes(query));
    if (!shown.length){ list.innerHTML = '<li class="empty-list">No channels found.</li>'; return; }
    shown.forEach(({c,i}) => {
      const li = document.createElement('li');
      li.className = 'item' + (i===current ? ' on' : '');
      li.innerHTML = `<span class="num">${i+1}</span>
        <button class="play"><strong>${esc(c.name)}</strong></button>`;
      li.querySelector('.play').onclick = () => tune(i);
      list.appendChild(li);
    });
  }

  function showOsd(n){
    const o = $('osd'); o.innerHTML = n + (channels[current] ? '<small>' + esc(channels[current].name) + '</small>' : ''); o.classList.add('show');
    clearTimeout(osdTimer); osdTimer = setTimeout(()=>o.classList.remove('show'), 1800);
  }

  let autoMuted = false;
  function startPlay(){
    video.play().then(()=>setStatus('Live')).catch(() => {
      video.muted = true; autoMuted = true;
      video.play().then(()=>setStatus('Live · Tap anywhere for sound')).catch(()=>{});
    });
  }
  document.addEventListener('pointerdown', () => {
    if (autoMuted){ video.muted = false; autoMuted = false; setStatus('Live'); }
  });
  document.addEventListener('keydown', () => {
    if (autoMuted){ video.muted = false; autoMuted = false; setStatus('Live'); }
  });

  function tune(i){
    if (!channels.length) return;
    current = (i + channels.length) % channels.length;
    const c = channels[current];
    $('chnum').textContent = current+1;
    $('nowName').textContent = c.name;
    $('nowMeta').textContent = '';
    showOsd(current+1); render();
    if (hls){ hls.destroy(); hls = null; }
    nativeTries = 0;
    if (isYouTube(c.url)){
      video.removeAttribute('src'); video.load();
      $('emptyScreen').style.display = 'grid';
      window.open(c.url, '_blank', 'noopener');
      setStatus('Opened in YouTube.'); return;
    }
    $('emptyScreen').style.display = 'none';
    setStatus('Connecting…');
    let url = c.url;
    insecure = location.protocol === 'https:' && /^http:\/\//i.test(url);
    if (insecure) url = url.replace(/^http:/i, 'https:'); // browsers only allow secure links; try the secure version
    playUrl(url, /\.m3u8(\?|$)/i.test(url) && video.canPlayType('application/vnd.apple.mpegurl') ? 'native' : 'auto');
  }
  let insecure = false, curUrl = '', curMode = '';
  function failMsg(){
    setStatus(insecure ? 'This channel’s link starts with http:// (not secure), so the browser blocks it.' : 'This channel isn’t available right now. Try another one.', true);
  }
  function playUrl(url, mode){
    if (hls){ hls.destroy(); hls = null; }
    curUrl = url; curMode = mode; nativeTries = 0;
    const isHls = /\.m3u8(\?|$)/i.test(url);
    if (mode !== 'native' && isHls && window.Hls && Hls.isSupported()){
      hls = new Hls();
      hls.loadSource(url); hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, () => { startPlay(); });
      let tries = 0; const myHls = hls;
      hls.on(Hls.Events.ERROR, (e, d) => {
        if (!d.fatal || hls !== myHls) return;
        if (tries < 3){
          tries++; setStatus('Reconnecting…');
          if (d.type === Hls.ErrorTypes.MEDIA_ERROR) hls.recoverMediaError();
          else setTimeout(() => { if (hls === myHls){ hls.loadSource(url); hls.startLoad(); } }, 2000);
        } else failMsg();
      });
      hls.on(Hls.Events.FRAG_LOADED, () => { if (tries){ tries = 0; setStatus('Live'); } });
    } else {
      video.src = url;
      startPlay();
    }
  }
  let nativeTries = 0;
  video.addEventListener('error', () => {
    if (current < 0 || hls || !curUrl) return;
    const ch = current;
    // Native player failed on an HLS link: switch to the built-in HLS engine
    if (curMode === 'native' && window.Hls && Hls.isSupported()){ setStatus('Connecting…'); playUrl(curUrl, 'auto'); return; }
    if (nativeTries < 2){ nativeTries++; setStatus('Reconnecting…'); setTimeout(() => { if (ch === current && !hls){ video.load(); startPlay(); } }, 2000); }
    else failMsg();
  });
  video.addEventListener('playing', () => { nativeTries = 0; });
  video.addEventListener('contextmenu', e => e.preventDefault());

  $('upBtn').onclick = () => tune(current<0 ? 0 : current-1);
  $('downBtn').onclick = () => tune(current<0 ? 0 : current+1);
  $('search').oninput = e => { query = e.target.value.trim().toLowerCase(); render(); };


  function fitBrand(){
    const box = document.querySelector('.brand'), t = $('brandText');
    if (!box || !t) return;
    if (document.body.classList.contains('ott')){ box.style.setProperty('font-size', Math.round(Math.min(34, Math.max(18, window.innerWidth/42))) + 'px', 'important'); return; }
    box.style.setProperty('font-size','16px','important');
    const w = box.clientWidth, tw = t.scrollWidth;
    if (w && tw) box.style.setProperty('font-size', (16 * w / tw * 0.99) + 'px', 'important');
  }
  fitBrand();

  // ---------- OTT / TV mode ----------
  const body = document.body;
  const land = window.matchMedia ? matchMedia('(orientation: landscape) and (min-width: 640px)') : null;
  let manual = false, guideTimer, infoTimer;
  const isOtt = () => body.classList.contains('ott');
  const guideOpen = () => body.classList.contains('guide-open');

  function applyMode(){
    const wide = window.innerWidth >= window.innerHeight;
    const on = manual || wide;
    body.classList.toggle('ott', !!on);
    body.classList.toggle('manual', manual && !wide);
    video.controls = !on;
    if (!on) closeGuide();
    fitBrand();
  }
  let lastWide = null;
  window.addEventListener('resize', () => { const w = window.innerWidth >= window.innerHeight; if (w !== lastWide){ lastWide = w; applyMode(); } });
  // Hide the TV browser's bars: go true full screen on the first button press or click
  function goNativeFs(){
    if (!isOtt() || document.fullscreenElement || document.webkitFullscreenElement) return;
    const el = document.documentElement, req = el.requestFullscreen || el.webkitRequestFullscreen;
    try { const r = req && req.call(el); if (r && r.catch) r.catch(()=>{}); } catch(e){}
  }
  document.addEventListener('keydown', goNativeFs, true);
  document.addEventListener('pointerdown', goNativeFs, true);

  function flashInfo(){
    body.classList.add('info'); clearTimeout(infoTimer);
    infoTimer = setTimeout(() => body.classList.remove('info'), 4000);
  }
  function resetGuideTimer(){ clearTimeout(guideTimer); guideTimer = setTimeout(closeGuide, 12000); }
  function openGuide(){
    body.classList.add('guide-open');
    const btn = document.querySelector('#list .item.on .play') || document.querySelector('#list .play');
    if (btn){ btn.focus(); btn.scrollIntoView({block:'center'}); }
    resetGuideTimer();
  }
  function closeGuide(){
    body.classList.remove('guide-open'); clearTimeout(guideTimer);
    if (document.activeElement && $('list').contains(document.activeElement)) document.activeElement.blur();
  }
  function moveFocus(dir){
    const btns = [...document.querySelectorAll('#list .play')]; if (!btns.length) return;
    let i = btns.indexOf(document.activeElement);
    i = i < 0 ? 0 : Math.min(btns.length-1, Math.max(0, i+dir));
    btns[i].focus(); btns[i].scrollIntoView({block:'nearest'});
  }

  $('fsBtn').onclick = () => {
    manual = true;
    const el = document.documentElement, req = el.requestFullscreen || el.webkitRequestFullscreen;
    try { const r = req && req.call(el); if (r && r.then) r.then(() => { try { screen.orientation.lock('landscape').catch(()=>{}); } catch(e){} }).catch(()=>{}); } catch(e){}
    applyMode();
  };
  function exitManual(){
    manual = false;
    const ex = document.exitFullscreen || document.webkitExitFullscreen;
    try { if ((document.fullscreenElement || document.webkitFullscreenElement) && ex){ const r = ex.call(document); if (r && r.catch) r.catch(()=>{}); } } catch(e){}
    applyMode();
  }
  $('exitOtt').onclick = exitManual;
  document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement && manual && window.innerWidth < window.innerHeight) exitManual(); });

  $('video').parentElement.addEventListener('click', () => {
    if (!isOtt()) return;
    if (guideOpen()) closeGuide(); else openGuide();
  });
  $('list').addEventListener('click', e => { if (isOtt() && e.target.closest('.play')) closeGuide(); });

  document.addEventListener('keydown', e => {
    const k = e.key, c = e.keyCode;
    const back = k==='Escape' || k==='GoBack' || k==='BrowserBack' || c===461 || c===10009 || (k==='Backspace' && !(e.target.matches && e.target.matches('input')));
    const up = k==='ArrowUp' || c===38, down = k==='ArrowDown' || c===40;
    const ok = k==='Enter' || c===13 || c===23;
    const chUp = k==='ChannelUp' || c===427 || k==='PageUp', chDown = k==='ChannelDown' || c===428 || k==='PageDown';
    if (isOtt() && guideOpen()){
      resetGuideTimer();
      if (back){ e.preventDefault(); closeGuide(); return; }
      if (e.target.matches && e.target.matches('input')) return;
      if (up || down){ e.preventDefault(); moveFocus(up ? -1 : 1); return; }
      return; // OK on a focused channel plays it
    }
    if (e.target.matches && e.target.matches('input')) return;
    if (chUp){ e.preventDefault(); tune(current<0 ? 0 : current+1); return; }
    if (chDown){ e.preventDefault(); tune(current<0 ? 0 : current-1); return; }
    if (up){ e.preventDefault(); tune(current<0 ? 0 : current+1); return; }
    if (down){ e.preventDefault(); tune(current<0 ? 0 : current-1); return; }
    if (isOtt() && ok){ e.preventDefault(); openGuide(); return; }
    if (isOtt() && back && manual){ e.preventDefault(); exitManual(); }
  });
  lastWide = window.innerWidth >= window.innerHeight;
  applyMode();
  window.addEventListener('resize', fitBrand);
  if (document.fonts) document.fonts.ready.then(fitBrand);
  const ACT_KEY = 'mtv-activated', act = $('act'), actBtns = [...act.querySelectorAll('button')];
  let code = '';
  const isActivated = () => { try { return localStorage.getItem(ACT_KEY) === '1'; } catch(e){ return false; } };
  function drawCode(){ act.querySelectorAll('.dots span').forEach((d,i) => { d.textContent = code[i] ? '•' : ''; d.classList.toggle('on', i < code.length); }); }
  function actPress(k){
    $('actMsg').textContent = '';
    if (k === 'del'){ code = code.slice(0,-1); }
    else if (k === 'ok'){
      if (code === '1010'){ try { localStorage.setItem(ACT_KEY,'1'); } catch(e){} act.hidden = true; loadPlaylist(); return; }
      $('actMsg').textContent = 'Wrong code. Try again.'; code = '';
    } else if (code.length < 4){ code += k; if (code.length === 4){ drawCode(); setTimeout(() => actPress('ok'), 250); return; } }
    drawCode();
  }
  actBtns.forEach(b => b.addEventListener('click', e => { e.stopPropagation(); actPress(b.dataset.k || b.textContent); }));
  document.addEventListener('keydown', e => {
    if (act.hidden) return;
    e.stopImmediatePropagation();
    const k = e.key, c = e.keyCode;
    if (/^[0-9]$/.test(k)){ e.preventDefault(); actPress(k); return; }
    if (c >= 96 && c <= 105){ e.preventDefault(); actPress(String(c-96)); return; }
    if (k === 'Backspace' || c === 461 || c === 10009){ e.preventDefault(); actPress('del'); return; }
    const i = actBtns.indexOf(document.activeElement);
    const mv = {ArrowLeft:-1, ArrowRight:1, ArrowUp:-3, ArrowDown:3}[k] ?? ({37:-1,39:1,38:-3,40:3}[c]);
    if (mv !== undefined){ e.preventDefault(); const n = i < 0 ? 0 : Math.min(actBtns.length-1, Math.max(0, i+mv)); actBtns[n].focus(); return; }
    if ((k === 'Enter' || c === 13 || c === 23) && i < 0){ e.preventDefault(); actPress('ok'); }
  }, true);
  if (isActivated()) loadPlaylist();
  else { act.hidden = false; drawCode(); setTimeout(() => actBtns[0].focus(), 50); }
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
