<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mohammed TV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Noto+Sans+Arabic:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.4.12/hls.min.js"></script>
<style>
:root{
  --bg:#EEF2F7; --panel:#FFFFFF; --ink:#0E1A2B; --muted:#5B6B80; --line:#D6DEE8;
  --signal:#E09A12; --signal-ink:#1B1200; --sky:#2F6FB0; --screen:#0A1422; --danger:#B3261E;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1A2B; --panel:#15253A; --ink:#EAF1F8; --muted:#93A6BD; --line:#24384F;
    --signal:#F2B33D; --signal-ink:#1B1200; --sky:#7FB3E6; --screen:#050C16; --danger:#F2867D;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1A2B; --panel:#15253A; --ink:#EAF1F8; --muted:#93A6BD; --line:#24384F;
  --signal:#F2B33D; --signal-ink:#1B1200; --sky:#7FB3E6; --screen:#050C16; --danger:#F2867D;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Bricolage Grotesque","Noto Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--signal);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.brand{font-weight:800;font-size:1.6rem;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
.brand .dot{width:12px;height:12px;border-radius:50%;background:var(--signal);box-shadow:0 0 0 4px color-mix(in srgb,var(--signal) 25%,transparent)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:9px 16px;font-weight:600}
.btn.primary{background:var(--signal);border-color:var(--signal);color:var(--signal-ink)}
.btn.ghost{background:transparent}
.layout{display:grid;gap:16px}
@media (min-width:860px){.layout{grid-template-columns:1.5fr 1fr;align-items:start}}

/* Screen + remote */
.tv{background:var(--screen);border-radius:18px;overflow:hidden;position:relative}
.tv video{display:block;width:100%;aspect-ratio:16/9;background:#000}
.osd{position:absolute;top:12px;right:14px;font-weight:800;font-size:2.4rem;line-height:1;color:#7CF2A0;
  text-shadow:0 0 12px rgba(124,242,160,.6);font-variant-numeric:tabular-nums;opacity:0;transition:opacity .3s;pointer-events:none}
.osd.show{opacity:1}
.empty-screen{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#C7D5E6;padding:20px}
.empty-screen p{margin:.3rem 0;max-width:34ch}
.remote{display:flex;align-items:center;gap:12px;margin-top:12px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px}
.chnum{font-weight:800;font-size:2rem;min-width:2.5ch;text-align:center;font-variant-numeric:tabular-nums;color:var(--signal)}
.nowinfo{flex:1;min-width:0}
.nowinfo .name{font-weight:600;font-size:1.1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nowinfo .meta{color:var(--muted);font-size:.9rem}
.updown{display:flex;flex-direction:column;gap:6px}
.updown button{width:44px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-weight:800}
.status{margin-top:8px;font-size:.9rem;color:var(--muted);min-height:1.3em}
.status.err{color:var(--danger)}

/* Channel list */
.guide{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px}
.guide h2{margin:0 0 10px;font-size:1.15rem}
.search{width:100%;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 4px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;white-space:nowrap;font-size:.9rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.list{list-style:none;margin:8px 0 0;padding:0;max-height:60vh;overflow-y:auto}
.item{display:flex;align-items:center;gap:12px;padding:10px 6px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .num{font-weight:800;width:2.4ch;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.item.on .num{color:var(--signal)}
.item .play{flex:1;min-width:0;text-align:start;background:none;border:0;padding:4px 0}
.item .play strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .play span{font-size:.85rem;color:var(--muted)}
.item .icon{background:none;border:0;color:var(--muted);padding:6px 8px;border-radius:8px}
.empty-list{color:var(--muted);padding:16px 4px}

/* Dialog */
dialog{border:1px solid var(--line);border-radius:18px;background:var(--panel);color:var(--ink);padding:0;width:min(520px,94vw)}
dialog::backdrop{background:rgba(5,12,22,.55)}
.dlg{padding:18px;display:grid;gap:12px}
.dlg h3{margin:0;font-size:1.2rem}
.dlg label{display:grid;gap:4px;font-weight:600;font-size:.95rem}
.dlg input,.dlg select,.dlg textarea{padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-weight:400}
.dlg textarea{min-height:120px;font-family:ui-monospace,Menlo,monospace;font-size:.85rem}
.dlg .hint{color:var(--muted);font-size:.85rem;font-weight:400}
.dlg .row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.tabs{display:flex;gap:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><span class="dot" aria-hidden="true"></span>Mohammed TV</div>
    <button class="btn primary" id="addBtn">Add channels</button>
  </header>

  <div class="layout">
    <section aria-label="Player">
      <div class="tv">
        <video id="video" controls playsinline></video>
        <div class="osd" id="osd" aria-hidden="true"></div>
        <div class="empty-screen" id="emptyScreen">
          <div>
            <p><strong>No channel playing</strong></p>
            <p>Add a channel’s stream link or import an M3U playlist, then tap it to watch.</p>
          </div>
        </div>
      </div>
      <div class="remote">
        <div class="chnum" id="chnum">–</div>
        <div class="nowinfo">
          <div class="name" id="nowName">Pick a channel</div>
          <div class="meta" id="nowMeta">Use ▲ ▼ or your arrow keys to switch</div>
        </div>
        <div class="updown">
          <button id="upBtn" aria-label="Previous channel">▲</button>
          <button id="downBtn" aria-label="Next channel">▼</button>
        </div>
      </div>
      <div class="status" id="status" role="status"></div>
    </section>

    <section class="guide" aria-label="Channel list">
      <h2>Channels</h2>
      <input class="search" id="search" type="search" placeholder="Search channels">
      <div class="chips" id="chips"></div>
      <ul class="list" id="list"></ul>
    </section>
  </div>
</div>

<dialog id="dlg">
  <form class="dlg" method="dialog" id="form">
    <h3 id="dlgTitle">Add channels</h3>
    <div class="tabs" id="tabs">
      <button type="button" class="chip" data-tab="one" aria-pressed="true">One channel</button>
      <button type="button" class="chip" data-tab="m3u" aria-pressed="false">Import M3U</button>
    </div>
    <div id="tabOne" style="display:grid;gap:12px">
      <label>Channel name<input id="fName" placeholder="e.g. Kurdistan 24"></label>
      <label>Stream link
        <input id="fUrl" inputmode="url" placeholder="https://…/live.m3u8">
        <span class="hint">Works with .m3u8 (HLS) and .mp4 links. YouTube links open in a new tab.</span>
      </label>
      <label>Category
        <input id="fCat" list="cats" placeholder="News, Sports, Kids…">
        <datalist id="cats"></datalist>
      </label>
    </div>
    <div id="tabM3u" style="display:none;gap:12px">
      <label>Playlist link<input id="fLink" inputmode="url" placeholder="https://…/playlist.m3u"></label>
      <label>Or playlist file<input id="fFile" type="file" accept=".m3u,.m3u8,.txt"></label>
      <label>Or paste playlist text<textarea id="fM3u" placeholder="#EXTM3U&#10;#EXTINF:-1 group-title=&quot;News&quot;,Channel name&#10;https://…/live.m3u8"></textarea></label>
    </div>
    <div class="row">
      <button type="button" class="btn danger ghost" id="delBtn" style="display:none;margin-right:auto;color:var(--danger)">Delete channel</button>
      <button type="button" class="btn ghost" id="cancelBtn">Cancel</button>
      <button type="submit" class="btn primary" id="saveBtn">Save channel</button>
    </div>
  </form>
</dialog>

<script>
(function(){
  const KEY = 'mohammed-tv-channels';
  const $ = id => document.getElementById(id);
  const video = $('video');
  let channels = load();
  let current = -1, filter = 'All', query = '', hls = null, editing = -1, tab = 'one', osdTimer;

  function load(){ try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch(e){ return []; } }
  function save(){ try { localStorage.setItem(KEY, JSON.stringify(channels)); } catch(e){} }
  function setStatus(msg, err){ const s=$('status'); s.textContent=msg||''; s.classList.toggle('err',!!err); }
  function isYouTube(u){ return /youtube\.com|youtu\.be/i.test(u); }

  function categories(){
    const set = new Set(channels.map(c => c.cat || 'Other'));
    return ['All', ...[...set].sort()];
  }

  function render(){
    const cats = categories();
    if (!cats.includes(filter)) filter = 'All';
    $('chips').innerHTML = '';
    cats.forEach(c => {
      const b = document.createElement('button');
      b.className = 'chip'; b.textContent = c; b.setAttribute('aria-pressed', c===filter);
      b.onclick = () => { filter = c; render(); };
      $('chips').appendChild(b);
    });
    $('cats').innerHTML = cats.slice(1).map(c => `<option value="${esc(c)}">`).join('');

    const list = $('list'); list.innerHTML = '';
    const shown = channels.map((c,i)=>({c,i})).filter(({c}) =>
      (filter==='All' || (c.cat||'Other')===filter) && c.name.toLowerCase().includes(query));
    if (!channels.length){ list.innerHTML = '<li class="empty-list">Your channel list is empty. Tap “Add channels” to start.</li>'; return; }
    if (!shown.length){ list.innerHTML = '<li class="empty-list">No channels match. Try another search or category.</li>'; return; }
    shown.forEach(({c,i}) => {
      const li = document.createElement('li');
      li.className = 'item' + (i===current ? ' on' : '');
      li.innerHTML = `<span class="num">${i+1}</span>
        <button class="play"><strong>${esc(c.name)}</strong><span>${esc(c.cat||'Other')}${isYouTube(c.url)?' · opens YouTube':''}</span></button>
        <button class="icon" aria-label="Edit ${esc(c.name)}">✎</button>`;
      li.querySelector('.play').onclick = () => tune(i);
      li.querySelector('.icon').onclick = () => openDialog(i);
      list.appendChild(li);
    });
  }

  function esc(s){ return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

  function showOsd(n){
    const o = $('osd'); o.textContent = n; o.classList.add('show');
    clearTimeout(osdTimer); osdTimer = setTimeout(()=>o.classList.remove('show'), 1800);
  }

  function tune(i){
    if (!channels.length) return;
    current = (i + channels.length) % channels.length;
    const c = channels[current];
    $('chnum').textContent = current+1;
    $('nowName').textContent = c.name;
    $('nowMeta').textContent = c.cat || 'Other';
    showOsd(current+1);
    render();
    if (hls){ hls.destroy(); hls = null; }
    if (isYouTube(c.url)){
      video.removeAttribute('src'); video.load();
      $('emptyScreen').style.display = 'grid';
      window.open(c.url, '_blank', 'noopener');
      setStatus('Opened in YouTube.');
      return;
    }
    $('emptyScreen').style.display = 'none';
    setStatus('Connecting…');
    const isHls = /\.m3u8(\?|$)/i.test(c.url);
    if (isHls && window.Hls && Hls.isSupported()){
      hls = new Hls();
      hls.loadSource(c.url); hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, () => { video.play().catch(()=>{}); setStatus('Live'); });
      hls.on(Hls.Events.ERROR, (e, d) => { if (d.fatal) setStatus('This stream didn’t load. The link may be offline or blocked outside its home country.', true); });
    } else {
      video.src = c.url;
      video.play().then(()=>setStatus('Live')).catch(()=>{});
    }
  }
  video.addEventListener('error', () => { if (current>=0 && !hls) setStatus('This stream didn’t load. The link may be offline or in a format your browser can’t play.', true); });

  $('upBtn').onclick = () => tune(current<0 ? 0 : current-1);
  $('downBtn').onclick = () => tune(current<0 ? 0 : current+1);
  document.addEventListener('keydown', e => {
    if (e.target.matches('input,textarea,select') || $('dlg').open) return;
    if (e.key==='ArrowUp'){ e.preventDefault(); $('upBtn').click(); }
    if (e.key==='ArrowDown'){ e.preventDefault(); $('downBtn').click(); }
  });
  $('search').oninput = e => { query = e.target.value.trim().toLowerCase(); render(); };

  // Dialog
  function setTab(t){
    tab = t;
    document.querySelectorAll('#tabs .chip').forEach(b => b.setAttribute('aria-pressed', b.dataset.tab===t));
    $('tabOne').style.display = t==='one' ? 'grid' : 'none';
    $('tabM3u').style.display = t==='m3u' ? 'grid' : 'none';
    $('saveBtn').textContent = t==='one' ? (editing>=0 ? 'Save changes' : 'Save channel') : 'Import channels';
  }
  document.querySelectorAll('#tabs .chip').forEach(b => b.onclick = () => setTab(b.dataset.tab));

  function openDialog(i){
    editing = i;
    const c = i>=0 ? channels[i] : {name:'',url:'',cat:''};
    $('fName').value = c.name; $('fUrl').value = c.url; $('fCat').value = c.cat || '';
    $('fM3u').value = ''; $('fFile').value = ''; $('fLink').value = '';
    $('dlgTitle').textContent = i>=0 ? 'Edit channel' : 'Add channels';
    $('tabs').style.display = i>=0 ? 'none' : 'flex';
    $('delBtn').style.display = i>=0 ? 'inline-block' : 'none';
    setTab('one');
    $('dlg').showModal();
  }
  $('addBtn').onclick = () => openDialog(-1);
  $('cancelBtn').onclick = () => $('dlg').close();
  $('delBtn').onclick = () => {
    channels.splice(editing,1);
    if (current===editing){ current=-1; if(hls){hls.destroy();hls=null;} video.removeAttribute('src'); video.load();
      $('emptyScreen').style.display='grid'; $('chnum').textContent='–'; $('nowName').textContent='Pick a channel'; setStatus(''); }
    else if (current>editing) current--;
    save(); render(); $('dlg').close();
  };

  $('fFile').onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader(); r.onload = () => { $('fM3u').value = r.result; }; r.readAsText(f);
  };

  function parseM3u(text){
    const out = []; let pending = null;
    text.split(/\r?\n/).forEach(line => {
      line = line.trim();
      if (line.startsWith('#EXTINF')){
        const name = line.split(',').slice(1).join(',').trim() || 'Channel';
        const g = line.match(/group-title="([^"]*)"/i);
        pending = {name, cat: g && g[1] ? g[1] : 'Other'};
      } else if (line && !line.startsWith('#')){
        out.push({name: pending ? pending.name : line, url: line, cat: pending ? pending.cat : 'Other'});
        pending = null;
      }
    });
    return out;
  }

  $('form').addEventListener('submit', async e => {
    e.preventDefault();
    if (tab==='m3u'){
      let link = $('fLink').value.trim();
      const pasted = $('fM3u').value.trim();
      if (!link && /^https?:\/\/\S+$/i.test(pasted)) link = pasted;
      if (link){
        const btn = $('saveBtn'); btn.disabled = true; btn.textContent = 'Downloading…';
        try {
          const res = await fetch(link);
          if (!res.ok) throw new Error('HTTP ' + res.status);
          const text = await res.text();
          if (/#EXTINF/i.test(text)) {
            $('fM3u').value = text;
          } else if (/#EXT-X-/i.test(text)) {
            channels.push({name: link.split('/').pop().replace(/\.m3u8?.*$/i,'') || 'Channel', url: link, cat: 'Other'});
            save(); render(); $('dlg').close(); setStatus('Added 1 channel.');
            return;
          } else {
            alert('That link didn’t return a playlist. Check that it opens a file starting with #EXTM3U.');
            return;
          }
        } catch(err){
          alert('Couldn’t download the playlist. Check the link and your internet connection. If you’re viewing this inside the Claude app, open the file in Chrome instead, since the preview blocks downloads from other sites.');
          return;
        } finally { btn.disabled = false; btn.textContent = 'Import channels'; }
      }
    }
    if (tab==='one'){
      const name = $('fName').value.trim(), url = $('fUrl').value.trim(), cat = $('fCat').value.trim() || 'Other';
      if (!name || !/^https?:\/\//i.test(url)){ alert('Enter a channel name and a link starting with http:// or https://'); return; }
      if (editing>=0) channels[editing] = {name,url,cat}; else channels.push({name,url,cat});
    } else {
      const found = parseM3u($('fM3u').value);
      if (!found.length){ alert('No channels found in that playlist. Check that it has #EXTINF lines followed by links.'); return; }
      channels.push(...found);
      setStatus(`Imported ${found.length} channel${found.length>1?'s':''}.`);
    }
    save(); render(); $('dlg').close();
  });

  render();
})();
</script>
</body>
</html>
